name: Build and Release Debian & Source Packages

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ] # Triggers release build on version tags (e.g., v1.5.12-1)
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Packaging Tools & Utilities
        run: |
          sudo apt update
          sudo apt install -y \
            appstream-util \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            equivs \
            fakeroot \
            lintian \
            zip

      - name: Install Declared Build Dependencies
        run: |
          sudo mk-build-deps --install --remove --tool "apt-get -y --no-install-recommends" debian/control

      - name: Validate AppStream Metadata
        run: |
          appstream-util validate debian/org.example.tuiweathergirl.metainfo.xml

      - name: Build Debian Packages
        run: |
          # Build binary packages only, without signing
          dpkg-buildpackage -us -uc -b

      - name: Run Lintian Checks
        run: |
          # Fails the build if any errors (E:) are found
          lintian --fail-on error --pedantic ../*.deb

      - name: Organize Artifacts
        run: |
          mkdir -p dist
          # Copy generated .deb packages
          cp ../*.deb dist/
          # Create custom source zip containing only the specified files
          zip dist/tuiweathergirl.zip Makefile README.md tuiweathergirl.py windows_install.bat create_win10shortcut.bat

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
