[project]
name = "tuiweathergirl"
version = "1.3.0"
requires-python = ">=3.9"
description = "Weather and Disaster monitoring station."
authors = [
    { name = "Evgueni Antonov", email = "Evgueni.Antonov@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["weather", "disaster", "meteo", "meteorology", "earthquakes", "antarctic", "research", "allergies", "health"]
dependencies = [
    "Babel",
    "requests",
    "packaging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Environment :: Console",
    "Environment :: Console :: Curses",
]

[tool.bumpversion]
current_version = "1.3.0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
post_commit_hooks = ["git push origin main", "git push origin --tags"]

# List all files where the version string needs to be bumped
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "tuiweathergirl.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'v{current_version}'
replace = 'v{new_version}'
